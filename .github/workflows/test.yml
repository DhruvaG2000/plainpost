name: Test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: node --test
      - run: node scripts/smoke.mjs
      - name: Linux launcher and boot service
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node scripts/smoke.mjs --linux-launcher
          node scripts/systemd.mjs > "$RUNNER_TEMP/plainpost.service"
          systemd-analyze --user verify "$RUNNER_TEMP/plainpost.service"
